services:
  - type: web
    name: agency-os
    runtime: python
    rootDir: telegram_scraper
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn story_scheduler:app --host 0.0.0.0 --port $PORT
    disk:
      name: agency-os-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: DATA_DIR
        value: /data
